syntax = "proto3";
package plugnmeet;

option go_package = "github.com/mynaparrot/plugnmeet-protocol/plugnmeet";
option php_namespace = "Mynaparrot\\PlugnmeetProto";

enum RoomArtifactType {
  UNKNOWN_ARTIFACT = 0;
  MEETING_ANALYTICS = 1;

  MEETING_SUMMARY = 2;
  MEETING_SUMMARY_USAGE = 3;

  SPEECH_TRANSCRIPTION = 4;
  SPEECH_TRANSCRIPTION_USAGE = 5;
  SYNTHESIZED_SPEECH_USAGE = 6;

  CHAT_TRANSLATION_USAGE = 7;
  AI_TEXT_CHAT_INTERACTION_USAGE = 8;
  AI_TEXT_CHAT_SUMMARIZATION_USAGE = 9;

  AI_AGENT_USAGE = 10;
  AI_AGENT_SESSION_SUMMARY = 11;
  AI_AGENT_TRANSCRIPT = 12;
}

// FileInfo contains details about a generated file artifact.
message RoomArtifactFileInfo {
  string file_path = 1;
  int64 file_size = 2;
  string mime_type = 3;
}

// ProviderJobInfo contains details about an asynchronous job sent to a provider.
message RoomArtifactProviderJobInfo {
  string job_id = 1;
  string file_name = 2;
}

// UserInfo contains details about the user associated with an artifact.
message RoomArtifactUserInfo {
  string user_id = 1;
  optional string name = 2;
  optional string ex_user_id = 3;
  // extra_data carries the user's custom metadata as a JSON object.
  optional string extra_data = 4;
}

message RoomArtifactTokenUsage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
  map<string, int64> breakdown = 4;

  optional double prompt_tokens_estimated_cost = 5;
  optional double completion_tokens_estimated_cost = 6;
  optional double total_tokens_estimated_cost = 7;
}

message RoomArtifactDurationUsage {
  uint32 duration_sec = 1;
  map<string, int64> breakdown = 2;

  optional double duration_sec_estimated_cost = 3;
}

message RoomArtifactCharacterCountUsage {
  uint32 total_characters = 1;
  map<string, int64> breakdown = 2;

  optional double total_characters_estimated_cost = 3;
}

// RoomArtifactMetadata is the universal structure for the 'metadata' JSON field
// in the pnm_room_artifacts table. All fields are optional.
message RoomArtifactMetadata {
  // Optional: Information about the user who initiated or is associated with the artifact.
  RoomArtifactUserInfo user_info = 1;

  // Optional: Information about an asynchronous provider job.
  RoomArtifactProviderJobInfo provider_job_info = 2;

  // Optional: Information about the final generated file artifact.
  RoomArtifactFileInfo file_info = 3;

  // A field for different types of usage metrics.
  oneof usage_details {
    RoomArtifactTokenUsage token_usage = 4;
    RoomArtifactDurationUsage duration_usage = 5;
    RoomArtifactCharacterCountUsage character_count_usage = 6;
  }

  // to identify if artificial belongs to any breakout room
  // which usually we merge into the main room
  optional bool occurred_in_breakout_room = 7;
  uint64 source_room_table_id = 8;

  // A field to link a file artifact back to its usage artifact.
  optional string reference_artifact_id = 10;
}

// Webhook-specific Messages
message RoomArtifactWebhookEvent {
  RoomArtifactType type = 1;
  string artifact_id = 2;
  RoomArtifactMetadata metadata = 3;
}

// AI agent session summary contract for the AI_AGENT_SESSION_SUMMARY artifact.
message AIAgentSessionSummary {
  // summary_source is "llm" when a model refined the summary, "local_fallback"
  // when it was derived from telemetry only.
  string summary_source = 1;
  string generated_at = 2;
  // the learner of the 1-on-1 session; always present
  RoomArtifactUserInfo user_info = 3;
  AIAgentSummarySession session = 4;
  AIAgentSummaryEvaluation evaluation = 5;
  AIAgentSummaryQuizEvaluation quiz_evaluation = 6;
  repeated AIAgentSummaryProgressEntry progress_log = 7;
  AIAgentSummaryWorkspaceActivity workspace_activity = 8;
  AIAgentSummaryContinuation continuation = 9;
  string narrative_summary = 10;
  // usage is keyed by role: "session", "delegation" or "summary".
  map<string, RoomArtifactTokenUsage> usage = 11;
}

message AIAgentSummarySession {
  string room_id = 1;
  string room_sid = 2;
  string session_id = 3;
  string agent_display_name = 4;
  string topic = 5;
  repeated string allowed_subtopics = 6;
  int64 started_at = 7;
  int64 ended_at = 8;
  int64 duration_seconds = 9;
  string end_reason = 10;
  int32 off_topic_redirects_count = 11;
  int32 turns_count = 12;
}

message AIAgentSummaryEvaluation {
  int32 overall_score = 1;
  string mastery_level = 2;
  string participation_level = 3;
  repeated string concepts_mastered = 4;
  repeated string concepts_practiced = 5;
  repeated string struggled_with = 6;
  repeated string vocabulary_or_key_terms = 7;
  string rubric_notes = 8;
}

message AIAgentSummaryQuizEvaluation {
  int32 total_quizzes = 1;
  int32 total_responses = 2;
  int32 correct_responses = 3;
  int32 accuracy_percent = 4;
  repeated AIAgentSummaryQuizQuestion questions = 5;
}

message AIAgentSummaryQuizQuestion {
  string poll_id = 1;
  string question = 2;
  string correct_option = 3;
  uint64 total_votes = 4;
  uint64 correct_votes = 5;
  bool passed = 6;
}

message AIAgentSummaryProgressEntry {
  string concept = 1;
  string status = 2;
  optional string notes = 3;
}

message AIAgentSummaryWorkspaceActivity {
  map<string, int32> tools_used = 1;
  bool whiteboard_used = 2;
  bool notepad_used = 3;
}

message AIAgentSummaryContinuation {
  string next_session_focus = 1;
  string recommended_warm_up = 2;
  repeated string unfinished_subtopics = 3;
  string previous_session_context_prompt = 4;
}
