syntax = "proto3";
package plugnmeet;

option go_package = "github.com/mynaparrot/plugnmeet-protocol/plugnmeet";
option php_namespace = "Mynaparrot\\PlugnmeetProto";

message ActivatePollsReq {
  string room_id = 1;
  bool is_active = 2;
}

message CreatePollReq {
  string room_id = 1;
  string user_id = 2;
  string poll_id = 3;
  string question = 4;
  repeated CreatePollOptions options = 5;
  bool is_anonymous = 6;
  bool is_multiple = 7;
  bool is_quiz = 8;
  uint32 duration = 9;
  bool is_text_answer = 10;
}

message CreatePollRes {
  bool status = 1;
  string msg = 2;
  string poll_id = 3;
}

message CreatePollOptions {
  uint32 id = 1;
  string text = 2;
  bool is_correct = 3;
}

message PollInfo {
  string id = 1;
  string room_id = 2;
  string question = 3;
  repeated CreatePollOptions options = 4;
  bool is_running = 5;
  int64 created = 6;
  string created_by = 7;
  string closed_by = 8;
  bool is_anonymous = 9;
  bool is_multiple = 10;
  bool is_quiz = 11;
  int64 expires_at = 12;
  uint32 duration = 13;
  bool is_text_answer = 14;
}

message SubmitPollResponseReq {
  string room_id = 1;
  string user_id = 2;
  string name = 3;
  string poll_id = 4;
  repeated uint64 selected_options = 5;
  string text_answer = 6;
}

message ReopenPollReq {
  string room_id = 1;
  string user_id = 2;
  string poll_id = 3;
}

message ClosePollReq {
  string room_id = 1;
  string user_id = 2;
  string poll_id = 3;
}

message PollResponsesResultOptions {
  uint64 id = 1;
  string text = 2;
  uint64 vote_count = 3;
  bool is_correct = 4;
}

// PollTextAnswerResult is one aggregated free-text answer: the display text of
// the first submission plus the number of matching (case-insensitive) answers.
message PollTextAnswerResult {
  string text = 1;
  uint64 count = 2;
}

message PollResponsesResult {
  string question = 1;
  uint64 total_responses = 2;
  uint64 total_votes = 3;
  repeated PollResponsesResultOptions options = 4;
  repeated PollTextAnswerResult text_answers = 5;
}

message PollsStats {
  uint64 total_polls = 1;
  uint64 total_running = 2;
}

message PollRespondent {
  string user_id = 1;
  string name = 2;
  repeated uint64 option_ids = 3;
  string text_answer = 4;
}

// Per-poll responses detail: aggregate counts plus the full respondent list
// (omitted entirely for anonymous polls — participation only is stored).
message PollResponsesDetails {
  uint64 total_respondents = 1;
  // aggregate counts only; respondents are delivered separately below
  repeated PollResponsesResultOptions options = 2;
  repeated PollRespondent respondents = 3;
  repeated PollTextAnswerResult text_answers = 4;
}

message PollResponse {
  bool status = 1;
  string msg = 2;
  optional string poll_id = 3;
  optional uint64 total_responses = 4;
  repeated uint64 voted = 5;
  optional PollResponsesDetails responses_details = 6;
  repeated PollInfo polls = 7;
  optional PollsStats stats = 8;
  optional uint64 total_polls = 9;
  optional uint64 total_running = 10;
  optional PollResponsesResult poll_responses_result = 11;
  optional bool has_voted = 12;
  optional string voted_text = 13;
}
