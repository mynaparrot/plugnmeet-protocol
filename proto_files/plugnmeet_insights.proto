syntax = "proto3";
package plugnmeet;

option go_package = "github.com/mynaparrot/plugnmeet-protocol/plugnmeet";
option php_namespace = "Mynaparrot\\PlugnmeetProto";

enum InsightsServiceType {
  INSIGHTS_SERVICE_TYPE_UNSPECIFIED = 0;
  INSIGHTS_SERVICE_TYPE_TRANSCRIPTION = 1;
  INSIGHTS_SERVICE_TYPE_TRANSLATION = 2;
  INSIGHTS_SERVICE_TYPE_SPEECH_SYNTHESIS = 3;
  INSIGHTS_SERVICE_TYPE_AI_TEXT_CHAT = 4;
  INSIGHTS_SERVICE_TYPE_CHAT_TRANSLATION = 5;
  INSIGHTS_SERVICE_TYPE_MEETING_SUMMARIZING = 6;
  INSIGHTS_SERVICE_TYPE_AI_AGENT = 7;
}

enum InsightsUserSessionAction {
  USER_SESSION_ACTION_UNSPECIFIED = 0;
  USER_SESSION_ACTION_START = 1;
  USER_SESSION_ACTION_STOP = 2;
}

message InsightsSupportedLangInfo {
  string code = 1;
  string name = 2;
  string locale = 3;
}

message InsightsTranscriptionConfigReq {
  bool is_enabled = 1;
  repeated string allowed_spoken_langs = 2;
  repeated string allowed_speech_users = 3;

  bool is_enabled_translation = 4;
  repeated string allowed_trans_langs = 5;
  optional string default_subtitle_lang = 6;

  bool is_enabled_speech_synthesis = 7;
}

message InsightsTranscriptionUserSessionReq {
  InsightsUserSessionAction action = 1;
  optional string spoken_lang = 2;
  bool allowed_transcription_storage = 3;
}

message InsightsTranscriptionResult {
  string from_user_id = 1;
  string from_user_name = 2;
  string lang = 3;
  string text = 4;
  bool is_partial = 5;
  bool allowed_transcription_storage = 6;
  map<string, string> translations = 7; // A map of target language -> translated text
}

message InsightsChatTranslationConfigReq {
  bool is_enabled = 1;
  repeated string allowed_trans_langs = 5;
  optional string default_lang = 6;
}

message InsightsTranslateTextReq {
  string text = 1;
  string source_lang = 2;
  repeated string target_langs = 3;
}

message InsightsTextTranslationResult {
  string source_text = 1;
  string source_lang = 2;
  map<string, string> translations = 3; // map of lang_code -> translated_text
}

message InsightsTranslateTextRes {
  bool status = 1;
  string msg = 2;
  optional InsightsTextTranslationResult result = 3;
}

message InsightsGetSupportedLanguagesReq {
  InsightsServiceType service_type = 1;
}

message InsightsGetSupportedLanguagesRes {
  bool status = 1;
  string msg = 2;
  repeated InsightsSupportedLangInfo languages = 3;
}

message InsightsGetUserStatusRes {
  bool status = 1;
  string msg = 2;
  InsightsServiceType service_type = 3;
  bool is_active = 4;
  optional string spoken_lang = 5;
  optional bool allowed_transcription_storage = 6;
}

enum InsightsAIRequestSource {
  INSIGHTS_AI_REQUEST_SOURCE_CHAT = 0;
  INSIGHTS_AI_REQUEST_SOURCE_NOTEPAD = 1;
  INSIGHTS_AI_REQUEST_SOURCE_WHITEBOARD = 2;
  INSIGHTS_AI_REQUEST_SOURCE_POLL = 3;
  INSIGHTS_AI_REQUEST_SOURCE_AI_AGENT = 4; // AI-Agent-originated AI traffic
}

// start AI Text Chat
enum InsightsAITextChatRole {
  INSIGHTS_AI_TEXT_CHAT_ROLE_UNSPECIFIED = 0;
  INSIGHTS_AI_TEXT_CHAT_ROLE_SYSTEM = 1;
  INSIGHTS_AI_TEXT_CHAT_ROLE_USER = 2;
  INSIGHTS_AI_TEXT_CHAT_ROLE_MODEL = 3;
}

message InsightsAITextChatContent {
  InsightsAITextChatRole role = 1;
  string text = 2;
  optional string stream_id = 3;
  optional InsightsAIRequestSource request_from = 4;
}

message InsightsAITextChatStreamResult {
  string id = 1;
  string text = 2;
  bool is_last_chunk = 3;
  uint32 prompt_tokens = 4;
  uint32 completion_tokens = 5;
  uint32 total_tokens = 6;
  string createdAt = 7;
  optional InsightsAIRequestSource request_from = 8;
}

message InsightsAITextChatConfigReq {
  bool is_enabled = 1;
  bool is_allowed_everyone = 3;
  repeated string allowed_user_ids = 4;
  bool is_notepad_ai_disabled = 5;
  bool is_whiteboard_ai_disabled = 6;
  bool is_poll_ai_disabled = 7;
}
// end AI Text Chat

message InsightsAIMeetingSummarizationConfigReq {
  bool is_enabled = 1;
  string summarization_prompt = 3;
}

// start AI Agent
enum AIAgentRuntimeState {
  AI_AGENT_RUNTIME_STATE_UNSPECIFIED = 0;
  AI_AGENT_RUNTIME_STATE_CONNECTING = 1;
  AI_AGENT_RUNTIME_STATE_LISTENING = 2;
  AI_AGENT_RUNTIME_STATE_THINKING = 3;
  AI_AGENT_RUNTIME_STATE_SPEAKING = 4;
  AI_AGENT_RUNTIME_STATE_DRAWING = 5;
  AI_AGENT_RUNTIME_STATE_PAUSED = 6;
  AI_AGENT_RUNTIME_STATE_RECONNECTING = 7;
  AI_AGENT_RUNTIME_STATE_STOPPED = 8;
}

// host / moderator control requests
message AIAgentStartReq {
  optional string system_prompt = 1; // override; empty -> room features
}

message AIAgentStopReq {
  optional string reason = 1; // e.g. "host_stopped"
}

message AIAgentStatusReq {}

message AIAgentStatusRes {
  bool status = 1;
  string msg = 2;
  optional AIAgentStateMsg state = 3;
}

message AIAgentSendContextReq {
  string text = 1; // external context injected into the live session
  optional string source = 2; // e.g. "lms" | "timer"
}

message AIAgentPauseReq {}

message AIAgentResumeReq {}

message AIAgentRedelegateReq {
  optional string target_user_id = 1; // empty -> server re-selects the delegate
}

// payloads exchanged with the room
message AIAgentStateMsg {
  string session_id = 1;
  string agent_user_id = 2; // pnm_agent-ai_agent-<uuid>
  string agent_name = 3;
  AIAgentRuntimeState state = 4;
  bool is_speaking = 5;
  string tool_in_progress = 6;
  int64 started_at = 7;
  string reason = 8; // e.g. "budget" | "moderation" | "goaway" | "paused"
  string trace_id = 9;
  optional string avatar_provider = 10;
}

message AIAgentToolCallMsg {
  string session_id = 1;
  string call_id = 2; // provider call id, echoed back
  string tool_name = 3;
  string arguments_json = 4; // model-emitted JSON, unmodified
  string target_user_id = 5; // who must execute
  int64 deadline_unix_ms = 6; // server-side deadline
  string trace_id = 7;
}

message AIAgentToolResultMsg {
  string call_id = 1;
  bool ok = 2;
  string result_json = 3; // executor payload (element ids + bbox, etc.)
  string error = 4;
  int64 duration_ms = 5;
}

message AIAgentWhiteboardSceneMsg {
  string room_id = 1;
  string file_id = 2;
  int32 page = 3;
  string reason = 4; // "participant_edit" | "tool_request" | "page_change" | "session_start"
  bytes webp_image = 5;
  string scene_graph_json = 6;
  int64 captured_at_ms = 7;
  repeated string participant_element_ids = 8;
  repeated string agent_element_ids = 9;
}
// end AI Agent
