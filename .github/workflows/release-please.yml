name: Build server for release
on:
  push:
    branches:
      - main
      - ai_agent

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release-server:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ github.ref_name == 'main' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: '12.15.0'
      - name: Build and publish
        run: |
          bash generate.sh
          cd js

          if [ "${{ github.ref_name }}" = "ai_agent" ]; then
            pnpm version prerelease --preid=ai-agent --no-commit-hooks --no-git-tag-version
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .
            git commit -m "chore: bump ai-agent version [skip ci]"
            git push

            PUBLISH_TAG="ai_agent"
          else
            PUBLISH_TAG="latest" # Default tag for full releases

            if [ ! ${{ steps.release.outputs.release_created }} ]; then
              pnpm version prerelease --no-commit-hooks --no-git-tag-version
              # push changes
              git config user.name github-actions
              git config user.email github-actions@github.com
              git add .
              git commit -m "bump beta version"
              git push

              PUBLISH_TAG="beta" # Override tag for prereleases
            fi
          fi

          bash generate.sh
          npm install -g npm@latest
          # Use the dynamic tag for publishing
          npm publish --tag $PUBLISH_TAG --provenance
